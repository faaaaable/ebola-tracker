<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="fr" href="{{altFr}}">
<link rel="alternate" hreflang="en" href="{{altEn}}">
<link rel="alternate" hreflang="x-default" href="{{altFr}}">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#FDFAF6">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:locale:alternate" content="{{ogLocaleAlt}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{title}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="robots" content="index, follow">
<meta name="google-site-verification" content="{{verification}}" />
{{jsonLd}}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{analytics}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{analytics}}');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
{{headAssets}}
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>

<a class="skip-link" href="#contenu">{{t.skipToContent}}</a>

<div class="app-shell">

  <aside class="sidebar">

    <div class="side-head">
      <a class="brand" href="{{homeUrl}}" aria-label="{{t.siteTitleLinkLabel}}">
        <span class="dot is-live" aria-hidden="true"></span>
        <p class="site-title">ebola-tracker<span class="tld">.org</span></p>
      </a>

      <div class="lang-switch" role="group" aria-label="Langue / Language">
        <a class="lang-btn{{frActive}}" href="{{altFr}}" hreflang="fr" lang="fr" title="Français"{{frCurrent}}>
          <svg class="flag" viewBox="0 0 3 2" width="18" height="12" aria-hidden="true">
            <rect width="1" height="2" x="0" fill="#0055A4"/>
            <rect width="1" height="2" x="1" fill="#FFFFFF"/>
            <rect width="1" height="2" x="2" fill="#EF4135"/>
          </svg>
          <span class="code">FR</span>
        </a>
        <a class="lang-btn{{enActive}}" href="{{altEn}}" hreflang="en" lang="en" title="English"{{enCurrent}}>
          <svg class="flag" viewBox="0 0 60 30" width="18" height="12" aria-hidden="true">
            <rect width="60" height="30" fill="#00247d"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/>
            <path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/>
          </svg>
          <span class="code">EN</span>
        </a>
      </div>
    </div>

{{nav}}

    <div class="side-foot">
      <!-- Fraicheur des donnees : une seule information qui compte, la date du
           dernier bulletin officiel. La date de verification vient en second,
           pour expliquer un eventuel ecart plutot que de le laisser en
           suspens. -->
      <div class="side-freshness">
        <div id="autoUpdateNote"></div>
        <div id="todayUpdateNote"></div>
      </div>

      <button class="share-btn" id="btnShare" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
        <span data-i18n="shareBtn">{{i18n.shareBtn}}</span>
      </button>
    </div>

  </aside>

  <div class="main">
    <div class="wrap">

{{breadcrumb}}

      <main id="contenu">
{{content}}
{{related}}
      </main>

{{footer}}

    </div>
  </div>

</div>

<script>
{{pageGlobals}}
</script>
<!-- defer, comme Chart.js dans le <head> : les scripts differes s'executent
     dans l'ordre du document, donc la bibliotheque est chargee avant app.js.
     Sans ce defer, app.js s'executerait pendant l'analyse de la page, donc
     AVANT elle, et le graphique echouerait silencieusement. Le script en ligne
     juste au-dessus reste classique : il ne fait que poser des variables
     globales, et doit passer en premier.
     La carte, elle, ne depend plus d'aucune bibliotheque : c'est un SVG ecrit
     dans la page. -->
<script defer src="/assets/js/i18n.js"></script>
<script defer src="/assets/js/app.js"></script>
{{bodyAssets}}
</body>
</html>
