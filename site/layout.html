<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#FDFAF6">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{ogLocale}}">
<meta property="og:locale:alternate" content="{{ogLocaleAlt}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="{{title}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="robots" content="index, follow">
<meta name="google-site-verification" content="{{verification}}" />
{{jsonLd}}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{analytics}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{analytics}}');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
{{headAssets}}
<link rel="stylesheet" href="/assets/css/site.css?v={{v.css}}">
</head>
<body>

<a class="skip-link" href="#contenu">{{t.skipToContent}}</a>

<div class="app-shell">

  <aside class="sidebar">

    <div class="side-head">
      <a class="brand" href="{{homeUrl}}" aria-label="{{t.siteTitleLinkLabel}}">
        <span class="dot is-live" aria-hidden="true"></span>
        <p class="site-title">ebola-tracker<span class="tld">.org</span></p>
      </a>

      <!-- Deux codes, sans drapeau. Un drapeau designe un pays, pas une
           langue : afficher le tricolore pour « francais » sur un site
           consacre a la Republique democratique du Congo — pays francophone —
           revient a proposer au lecteur congolais sa propre langue sous les
           couleurs de la France. Meme travers cote anglais, dont la version
           s'adresse d'abord a l'OMS et aux ONG, pas aux Britanniques.

           Les deux SVG portaient deja aria-hidden : le site reconnaissait donc
           qu'ils n'apportaient aucune information. Ils etaient au passage les
           seules couleurs saturees de tout l'en-tete. -->
{{langSwitch}}
    </div>

    <!-- Trois traits : sur telephone ils remplacent la barre d'onglets, qui
         defilait horizontalement et n'en montrait que deux a la fois. Le
         bouton n'existe pas sur ordinateur, ou la colonne laterale affiche
         tout. -->
    <button class="nav-burger" type="button" id="btnMenu"
            aria-expanded="false" aria-controls="menuPrincipal"
            aria-label="{{t.menuOpen}}"
            data-label-open="{{t.menuOpen}}" data-label-close="{{t.menuClose}}">
      <span class="nav-burger-lines" aria-hidden="true"></span>
    </button>

    <!-- La navigation et le pied de colonne voyagent ensemble : sur telephone
         ils forment le menu plein ecran, fraicheur des donnees et partage
         compris. -->
    <div class="side-panel" id="menuPrincipal">

{{nav}}

    <div class="side-foot">
      <!-- Fraicheur des donnees : une seule information qui compte, la date du
           dernier bulletin officiel. La date de verification vient en second,
           pour expliquer un eventuel ecart plutot que de le laisser en
           suspens. -->
      <div class="side-freshness">
        <div id="autoUpdateNote"></div>
        <div id="todayUpdateNote"></div>
      </div>

      <button class="share-btn" id="btnShare" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
        <span data-i18n="shareBtn">{{i18n.shareBtn}}</span>
      </button>
    </div>
    </div>

  </aside>

  <div class="main">
    <div class="wrap">

{{breadcrumb}}

      <main id="contenu">
{{content}}
      </main>

{{footer}}

    </div>
  </div>

</div>

<script>
{{pageGlobals}}
</script>
<!-- defer, comme Chart.js dans le <head> : les scripts differes s'executent
     dans l'ordre du document, donc la bibliotheque est chargee avant app.js.
     Sans ce defer, app.js s'executerait pendant l'analyse de la page, donc
     AVANT elle, et le graphique echouerait silencieusement. Le script en ligne
     juste au-dessus reste classique : il ne fait que poser des variables
     globales, et doit passer en premier.
     La carte, elle, ne depend plus d'aucune bibliotheque : c'est un SVG ecrit
     dans la page. -->
<script defer src="/assets/js/i18n.js?v={{v.i18n}}"></script>
<script defer src="/assets/js/app.js?v={{v.app}}"></script>
{{bodyAssets}}
</body>
</html>
