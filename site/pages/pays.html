  <!-- Page d'un pays touche hors de RDC (Kenya, Ouganda : 9 octobre 2026,
       pour le referencement) : la fiche de la page « Autres pays », seule,
       puis des questions redigees a partir des memes faits et des memes
       sources (balisees en FAQPage). Contenu : data/autres-pays.json. -->
  <section class="section ap-tete">
    <div class="eyebrow"><span class="dot"></span><a href="{{url.autres-pays}}">{{t.navAutresPays}}</a></div>
    <h1 class="page-title">{{meta.h1}}</h1>
    <p class="lede">{{meta.lede}}</p>
  </section>

  <section class="section">
    <div class="ap-liste ap-seul">
{{pays.fiche}}
    </div>
    <p class="ap-maj ap-seul-maj">{{autresPaysMaj}}{{pays.carte}}</p>
  </section>

  <section class="section">
    <h2 class="ap-q-titre">{{t.paysQuestions}}</h2>
    <div class="faq-f1">
{{pays.questions}}
    </div>
    <div class="faq-fin ap-voir">
      <h2>{{t.paysVoirAussi}}</h2>
      <p>{{pays.autres}} <a href="{{url.autres-pays}}">{{t.autresPaysLienAccueil}} →</a> <a href="{{url.chronologie}}">{{t.navTimeline}} →</a></p>
    </div>
  </section>
