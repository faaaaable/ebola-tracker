  <!-- Cartographie (21 octobre 2026, maquette tmp/proto-carto-v1 retenue) :
       une carte a explorer, fond gris et relief leger, zones de sante de RDC
       et unites touchees hors RDC, curseur jour par jour, quatre lectures.
       Plein ecran sous la barre des onglets (demande du proprietaire) : pas
       d'en-tete visible ; le titre reste pour les moteurs et les lecteurs
       d'ecran, la note de source passe dans le (i) de la carte.
       La carte est construite par assets/js/cartographie.js (MapLibre) a
       partir de data/cartographie.json (scripts/build_cartographie.py). -->
  <h1 class="visually-hidden">{{meta.h1}}</h1>
  <div id="cartoApp" class="carto-app" role="region" aria-label="{{t.cartoAria}}">
    <noscript><p>{{t.cartoNoscript}}</p></noscript>
  </div>
  <script type="application/json" id="cartoConfig">{{carto.config}}</script>
