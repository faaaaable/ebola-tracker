name: Vérification quotidienne du bilan Ebola RDC

on:
  schedule:
    # Une fois par jour, en fin de journée : 20:00 UTC (~21:00 à Kinshasa)
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  check-sitrep:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vérifier les nouveaux bilans officiels
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/check_sitrep.py

      - name: Publier directement si une nouvelle donnée a été trouvée
        run: |
          if [ -f "data/sitreps.proposed.json" ]; then
            CONF=$(cat data/confidence.txt 2>/dev/null || echo "n/a")
            mv data/sitreps.proposed.json data/sitreps.json
            rm -f data/confidence.txt

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/sitreps.json
            git commit -m "Mise à jour automatique du bilan SITREP (confiance: $CONF)"
            git push
          else
            echo "Aucune nouvelle donnée à publier."
          fi

      # NOTE : assets/og-image.png est une VRAIE capture d'écran de la carte,
      # prise manuellement — elle n'est plus régénérée automatiquement ici.
      # Pense à la remplacer toi-même de temps en temps si tu veux qu'elle
      # reflète l'évolution de l'épidémie (voir instructions fournies).
