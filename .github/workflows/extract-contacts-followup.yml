name: Extraction taux de suivi des contacts

on:
  workflow_dispatch: {}

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pdfplumber

      - name: Lancer l'extraction
        run: python scripts/extract_contacts_followup.py

      - name: Committer le résultat
        run: |
          git config user.name "sitrep-bot"
          git config user.email "sitrep-bot@users.noreply.github.com"
          git add data/contacts-followup.json
          if git diff --cached --quiet; then
            echo "Aucun changement — rien à committer."
          else
            git commit -m "Extraction du taux de suivi des contacts"
            git pull --rebase origin main
            git push
          fi
