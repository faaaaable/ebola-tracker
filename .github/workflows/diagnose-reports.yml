name: Diagnostic extraction SitRep

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pdfplumber

      - name: Lancer le diagnostic
        run: python scripts/diagnose_reports.py

      - name: Committer le rapport de diagnostic
        run: |
          git config user.name "sitrep-bot"
          git config user.email "sitrep-bot@users.noreply.github.com"
          git add data/diagnostic_report.json
          git diff --staged --quiet || git commit -m "Rapport de diagnostic extraction SitRep"
          git push
