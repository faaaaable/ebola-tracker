name: Diagnostic shapefile zones de santé

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install geopandas requests

      - name: Lancer le diagnostic
        run: python scripts/inspect_health_zone_shapefile.py
