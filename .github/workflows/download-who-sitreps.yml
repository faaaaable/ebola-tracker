name: Téléchargement SitRep OMS

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le téléchargement
        run: python scripts/download_who_sitreps.py

      - name: Committer les changements
        run: |
          git config user.name "sitrep-bot"
          git config user.email "sitrep-bot@users.noreply.github.com"
          git add reports/who/
          git diff --staged --quiet || git commit -m "Téléchargement des Weekly External Situation Report OMS"
          git push
