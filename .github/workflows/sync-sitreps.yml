name: Synchronisation des SitRep Ebola RDC
on:
  # ─── SYNCHRONISATION AUTOMATIQUE EN PAUSE ───────────────────────────────
  # Mise en pause le 23 août 2026, à la demande : les mises à jour du site se
  # décident désormais une par une, plutôt que de tomber toutes seules chaque
  # matin. Le format des SitRep a change trois fois depuis mai, et une
  # extraction qui derape sans temoin publie des chiffres faux — le n°099
  # aurait publie 57151377 deces en 24h si personne n'avait regarde.
  #
  # POUR REPRENDRE : retirer le « # » des trois lignes ci-dessous.
  # schedule:
  #   # Tous les jours à 06h00 UTC (~08h00 Kinshasa).
  #   - cron: "0 6 * * *"
  workflow_dispatch: {}  # lancement manuel depuis l'onglet Actions
permissions:
  contents: write  # nécessaire pour que le job puisse commit + push
jobs:
  sync-sitreps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation des dépendances
        run: pip install requests beautifulsoup4 pdfplumber
      - name: Téléchargement des nouveaux SitRep
        run: python scripts/download_all_sitreps.py
      - name: Mise à jour des données du site (data/latest.json)
        run: python scripts/update_data.py
      - name: Mise à jour du suivi des contacts (data/contacts-followup.json)
        run: python scripts/extract_contacts_followup.py
      - name: Mise à jour du lieu des décès (data/deces-lieu.json)
        # Remise dans le workflow en même temps que le bouton de l'onglet
        # « Décès en communauté ». Les deux gestes vont ensemble : allumer
        # l'onglet sans cette étape et le graphique se fige dès le lendemain,
        # comme la série des décès communautaires l'avait fait pendant six
        # jours faute d'y figurer.
        run: python scripts/extraire_deces_lieu.py
      - name: Mise à jour de la page Riposte (alertes, laboratoire, CTE)
        # Trois séries lues dans le texte des bulletins, mises en cache dans
        # .cache/textes/ (ignoré par git) pour ne relire que le PDF nouveau.
        # Les contacts par province sont produits par l'étape précédente.
        run: |
          python scripts/extraire_alertes.py
          python scripts/extraire_laboratoire.py
          python scripts/extraire_cte.py
      - name: Installation de Node
        # Necessaire a scripts/build_pages.py, qui lit assets/js/i18n.js.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regeneration des pages du site
        # Les pages contiennent les chiffres du dernier bulletin ecrits en dur
        # (pour qu'ils soient visibles sans JavaScript, donc indexables) : elles
        # doivent etre regenerees des que les donnees changent.
        run: python scripts/build_pages.py
      - name: Commit et push si de nouveaux fichiers sont apparus
        run: |
          git config user.name "sitrep-bot"
          git config user.email "sitrep-bot@users.noreply.github.com"
          # province-history.json est réécrit par update_data.py à chaque
          # passage, mais il ne figurait pas ici : le bot ne l'a donc jamais
          # committé. Les pages générées dans le même run étaient justes — la
          # regénération lit le fichier frais — mais celui servi aux
          # navigateurs restait figé à la dernière reprise manuelle, et avec
          # lui le graphique « Par province », premier onglet de /donnees/.
          git add reports/ data/latest.json data/sitreps.json data/zones-history.json
          git add data/province-history.json data/contacts-followup.json
          git add data/deces-lieu.json
          git add $(python -c "import json;print(' '.join(json.load(open('site/.generated.json'))))") site/.generated.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau SitRep — rien à committer."
          else
            git commit -m "Sync automatique des SitRep MVE + mise à jour des données ($(date -u +'%Y-%m-%d'))"
            # Récupère tout changement fait entre-temps sur main (ex: une
            # modification manuelle pendant que ce job tournait) avant de
            # pousser, pour éviter un rejet "fetch first" qui ferait perdre
            # tout le travail de ce run — vu le 19/08/2026.
            git pull --rebase origin main
            git push
          fi
