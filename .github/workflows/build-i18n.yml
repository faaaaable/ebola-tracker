name: Génération de la version anglaise (en/index.html)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  build-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Générer en/index.html à partir de index.html
        run: python3 scripts/build_i18n.py

      - name: Publier si le fichier généré a changé
        run: |
          if [ -n "$(git status --porcelain en/index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add en/index.html
            git commit -m "Régénération automatique de en/index.html"
            git push
          else
            echo "en/index.html déjà à jour, rien à publier."
          fi
