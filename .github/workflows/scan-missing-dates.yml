name: Scan dates manquantes carte

on:
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pdfplumber

      - name: Lancer le scan
        run: python scripts/scan_missing_dates.py
