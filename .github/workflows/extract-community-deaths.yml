name: Extraction décès communautaires/intra-CTE

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pdfplumber

      - name: Lancer l'extraction
        run: python scripts/extract_community_deaths.py

      - name: Committer les changements
        run: |
          git config user.name "sitrep-bot"
          git config user.email "sitrep-bot@users.noreply.github.com"
          git add data/community-deaths-daily.json
          git diff --staged --quiet || git commit -m "Extraction des décès communautaires/intra-CTE quotidiens par province"
          git push
