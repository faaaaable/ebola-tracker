name: Génération des pages du site

# Le site est désormais généré : les fichiers HTML à la racine, dans /en/ et
# dans /provinces/ sont produits par scripts/build_pages.py à partir de site/.
# Les modifier à la main n'a pas d'effet durable — ce workflow les réécrit.
#
# (Il remplace build-i18n.yml, qui appelait un scripts/build_i18n.py absent du
# dépôt et échouait donc à chaque exécution.)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/js/i18n.js'
      - 'scripts/build_pages.py'
      - 'scripts/dump_i18n.mjs'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer Node
        # Sert à lire assets/js/i18n.js, qui reste la source unique des libellés.
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer les pages
        run: python scripts/build_pages.py

      - name: Publier si les pages générées ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $(python -c "import json;print(' '.join(json.load(open('site/.generated.json'))))") site/.generated.json
          if git diff --cached --quiet; then
            echo "Pages déjà à jour, rien à publier."
          else
            git commit -m "Régénération des pages du site"
            git pull --rebase origin main
            git push
          fi
