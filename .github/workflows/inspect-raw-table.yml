name: Inspection table brute

on:
  workflow_dispatch:
    inputs:
      numero:
        description: "Numéro du SitRep à inspecter (ex: 007)"
        required: true
        default: "007"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install pdfplumber

      - name: Lancer le dump
        run: python scripts/inspect_raw_table.py "${{ github.event.inputs.numero }}"
